spring:
  application:
    name: pet-management

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: archive

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  docker:
    compose:
      enabled: false

  security:
    user:
      name: ${SECURITY_USER_NAME}
      password: ${SECURITY_USER_PASSWORD}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdotenv:
  enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
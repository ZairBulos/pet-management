spring:
  application:
    name: pet-management

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: archive

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  docker:
    compose:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdotenv:
  enabled: false